# Portable validation on Gitea-connected Woodpecker runners. No publication credentials.
labels:
  platform: linux/amd64
  backend: docker
when:
  - event:
      - push
      - pull_request
      - manual
steps:
  - name: verify
    image: golang:1.26.10-bookworm@sha256:23ce71337b726608afb1bc00986e630a05034a87a87ea1fc2cd1ae5cf33387eb
    environment:
      CI: 'true'
      GOMAXPROCS: '2'
      GOFLAGS: -p=2
      XDG_CACHE_HOME: /tmp/appicon-cache
      XDG_CONFIG_HOME: /tmp/appicon-config
      XDG_DATA_HOME: /tmp/appicon-data
    commands:
      - |-
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y --no-install-recommends make python3 jq
      - mkdir -p /tmp/appicon-cache /tmp/appicon-config /tmp/appicon-data
      - make check-fast check-docs-crosslinks check-nightly-smoke
