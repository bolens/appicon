name: Development environment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: devenv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.paths.outputs.environment }}
      devcontainer: ${{ steps.paths.outputs.devcontainer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: paths
        with:
          filters: |
            devcontainer:
              - '.devcontainer/**'
              - '.github/workflows/devenv.yml'
              - 'package.json'
              - 'package-lock.json'
              - 'go.mod'
              - 'go.sum'
            environment:
              - 'devenv.*'
              - '.github/workflows/devenv.yml'
              - 'Makefile'
              - 'scripts/**'
              - 'tests/**'
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'

  validate:
    name: devenv (${{ matrix.os }})
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.environment == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702
        with:
          extra_nix_config: |
            extra-substituters = https://devenv.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=
      - name: Install pinned devenv
        run: nix profile install github:cachix/devenv/42246161fa3bf7cd18f8334d08c73d6aaa8762d3
      - name: Validate native development environment
        if: runner.os != 'Linux' || vars.WOODPECKER_NIX_CI != 'true'
        run: devenv test
      - name: Validate Docker development image
        if: runner.os == 'Linux'
        run: |
          python3 scripts/development-container.py build docker
          python3 scripts/development-container.py run docker -- make check-fast check-nightly-smoke

  devcontainer:
    name: devcontainer (Linux)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.devcontainer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build the editor development image
        run: docker build --file .devcontainer/Dockerfile --tag appicon-devcontainer:ci .devcontainer
      - name: Validate setup and repository checks as the workspace user
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/workspace" --workdir /workspace \
            --env HOME=/tmp/appicon-home \
            --env GOPATH=/tmp/appicon-go --env GOCACHE=/tmp/appicon-go-cache \
            --env GOMAXPROCS=2 --env GOFLAGS=-p=2 \
            appicon-devcontainer:ci bash -euc '
              mkdir -p "$HOME"
              git config --global --add safe.directory /workspace
              bash .devcontainer/post-create.sh
              make check-fast check-nightly-smoke check-markdownlint
            '

  result:
    name: Development environment
    if: always()
    needs: [changes, validate, devcontainer]
    runs-on: ubuntu-latest
    steps:
      - name: Require selected environment checks
        env:
          CHANGES: ${{ needs.changes.result }}
          VALIDATE: ${{ needs.validate.result }}
          DEVCONTAINER: ${{ needs.devcontainer.result }}
          DEVCONTAINER_SELECTED: ${{ needs.changes.outputs.devcontainer }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          test "$CHANGES" = success
          case "$VALIDATE" in success|skipped) ;; *) exit 1 ;; esac
          if [ "$DEVCONTAINER_SELECTED" = true ] || [ "$EVENT_NAME" = workflow_dispatch ]; then
            test "$DEVCONTAINER" = success
          else
            case "$DEVCONTAINER" in success|skipped) ;; *) exit 1 ;; esac
          fi
