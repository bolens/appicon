name: Pages

on:
  pull_request:
    paths:
      - site/**
      - docs/architecture/**
      - scripts/ci/build-pages-site.py
      - scripts/ci/check-pages-site.py
      - .github/workflows/pages.yml
  push:
    branches: [main]
    paths:
      - site/**
      - docs/architecture/**
      - scripts/ci/build-pages-site.py
      - scripts/ci/check-pages-site.py
      - .github/workflows/pages.yml
  release:
    types: [published]
  workflow_dispatch:

permissions: {}


concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate site source
        run: python3 scripts/ci/check-pages-site.py --site site --architecture docs/architecture/appicon.html --architecture-source docs/architecture/appicon.architecture.json
      - name: Build versioned preview
        run: |
          version="$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0-dev)"
          python3 scripts/ci/build-pages-site.py --architecture docs/architecture/appicon.html --architecture-name appicon.html --version "$version"
      - name: Check rendered accessibility
        run: |
          python3 -m http.server 4173 --directory _site &
          npx --yes lighthouse@12.8.2 http://127.0.0.1:4173/ --only-categories=accessibility --chrome-flags='--headless --no-sandbox' --preset=desktop --output=json --output-path=/tmp/lighthouse.json --quiet
          # Chrome versions vary on the experimental target-spacing audit.
          python3 -c "import json; score=json.load(open('/tmp/lighthouse.json'))['categories']['accessibility']['score']; print(f'accessibility={score:.0%}'); assert score >= 0.95"

  deploy:
    permissions:
      contents: read
      id-token: write
      pages: write
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Assemble versioned site
        run: |
          version="$(git describe --tags --abbrev=0)"
          python3 scripts/ci/build-pages-site.py --architecture docs/architecture/appicon.html --architecture-name appicon.html --version "$version"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site
          include-hidden-files: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
