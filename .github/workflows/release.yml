name: Release

on:
  workflow_dispatch:
    inputs:
      woodpecker_bridge:
        description: Sign and attest verified Woodpecker draft assets
        required: false
        type: boolean
        default: false
      woodpecker_finalize:
        description: Verify and finish the native packaging PR
        required: false
        type: boolean
        default: false
      packaging_pr:
        description: Native packaging PR number
        required: false
        type: string
      packaging_head:
        description: Exact verified PR head SHA
        required: false
        type: string
      packaging_base:
        description: Exact verified main base SHA
        required: false
        type: string
      packaging_tree:
        description: Exact generated packaging tree
        required: false
        type: string
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  await-ci:
    if: vars.WOODPECKER_PUBLISHING != 'true' && github.event_name == 'push'
    permissions:
      actions: read
      contents: read
    name: Await CI
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require successful CI on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Waiting for workflow CI to succeed on ${{ github.sha }}"
          # Up to ~45 minutes (90 * 30s). Prefer a green run; fail fast on red.
          for _ in $(seq 1 90); do
            set +e
            bash scripts/ci/await-ci-success.sh "${{ github.repository }}" "${{ github.sha }}"
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              exit 0
            fi
            if [ "$rc" -eq 1 ]; then
              exit 1
            fi
            sleep 30
          done
          echo "FAIL: timed out waiting for CI success on ${{ github.sha }}" >&2
          exit 1

  release:
    permissions:
      attestations: write
      contents: write
      id-token: write
    name: Build and publish
    needs: await-ci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.hashes.outputs.version }}
      amd64_sha256: ${{ steps.hashes.outputs.amd64_sha256 }}
      arm64_sha256: ${{ steps.hashes.outputs.arm64_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.10"

      - name: Build
        run: |
          set -euo pipefail
          bash scripts/ci/build-release.sh "${GITHUB_REF_NAME}" dist

      - name: Export release hashes
        id: hashes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          checksum() {
            awk -v name="$1" '$2 == name || $2 == "./" name { print $1 }' dist/SHA256SUMS
          }
          amd64="$(checksum "appicon_v${version}_linux_amd64.tar.gz")"
          arm64="$(checksum "appicon_v${version}_linux_arm64.tar.gz")"
          for value in "$amd64" "$arm64"; do
            [[ "$value" =~ ^[0-9a-f]{64}$ ]] || exit 1
          done
          {
            echo "version=$version"
            echo "amd64_sha256=$amd64"
            echo "arm64_sha256=$arm64"
          } >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign SHA256SUMS (keyless)
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle dist/SHA256SUMS.sigstore.json \
            dist/SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/SHA256SUMS.sigstore.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/SHA256SUMS.sigstore.json
          generate_release_notes: true

  update-packaging:
    permissions:
      contents: write
      pull-requests: write
    name: Open packaging update PR
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      branch: ${{ steps.pr.outputs.pull-request-branch }}
      number: ${{ steps.pr.outputs.pull-request-number }}
      operation: ${{ steps.pr.outputs.pull-request-operation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: main

      - name: Calculate tagged source hash
        id: source
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/appicon-${VERSION}.tar.gz"
          curl --fail --location --retry 5 --output "$archive" \
            "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/v${VERSION}.tar.gz"
          sha="$(sha256sum "$archive" | cut -d' ' -f1)"
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || exit 1
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"

      - name: Update packaging manifests
        run: |
          python3 scripts/ci/update-release-packaging.py \
            "${{ needs.release.outputs.version }}" \
            "${{ steps.source.outputs.sha256 }}" \
            "${{ needs.release.outputs.amd64_sha256 }}" \
            "${{ needs.release.outputs.arm64_sha256 }}"
          bash scripts/ci/check-packaging-versions.sh

      - name: Create packaging PR
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(packaging): update v${{ needs.release.outputs.version }} hashes"
          branch: "chore/packaging-v${{ needs.release.outputs.version }}"
          delete-branch: true
          title: "chore(packaging): update v${{ needs.release.outputs.version }} hashes"
          body: |
            Automated packaging refresh using hashes calculated from the tagged
            source archive and published Linux release assets.

  finalize-packaging:
    permissions:
      actions: write
      contents: write
      pull-requests: write
    name: Verify and merge packaging PR
    needs: [release, update-packaging]
    if: needs.update-packaging.outputs.number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Dispatch CI for packaging branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ needs.update-packaging.outputs.branch }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"

      - name: Wait for dispatched CI and squash-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ needs.update-packaging.outputs.branch }}
          PR: ${{ needs.update-packaging.outputs.number }}
        run: |
          set -euo pipefail
          run_id=""
          for _ in $(seq 1 30); do
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --branch "$BRANCH" --event workflow_dispatch --limit 1 \
              --json databaseId --jq '.[0].databaseId // empty')"
            [[ -n "$run_id" ]] && break
            sleep 10
          done
          [[ -n "$run_id" ]] || { echo "CI run was not scheduled" >&2; exit 1; }
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --delete-branch

  woodpecker-oidc:
    name: Sign verified Woodpecker release
    if: vars.WOODPECKER_PUBLISHING == 'true' && github.event_name == 'workflow_dispatch' && inputs.woodpecker_bridge && !inputs.woodpecker_finalize && startsWith(github.ref, 'refs/tags/v')
    permissions:
      attestations: write
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify native source and immutable draft assets
        id: native
        env:
          GH_TOKEN: ${{ github.token }}
          WOODPECKER_PUBLISHER_ID: ${{ vars.WOODPECKER_PUBLISHER_ID }}
        run: python3 scripts/ci/woodpecker-verify-bridge.py
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify retained native signature during draft recovery
        if: steps.native.outputs.signature_exists == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: >-
          cosign verify-blob --bundle .woodpecker-out/bridge/SHA256SUMS.sigstore.json
          --certificate-identity "https://github.com/bolens/appicon/.github/workflows/release.yml@refs/tags/$TAG"
          --certificate-oidc-issuer https://token.actions.githubusercontent.com
          .woodpecker-out/bridge/SHA256SUMS
      - name: Sign native checksum manifest with existing GitHub OIDC identity
        if: steps.native.outputs.signature_exists != 'true'
        run: cosign sign-blob --yes --bundle .woodpecker-out/bridge/SHA256SUMS.sigstore.json .woodpecker-out/bridge/SHA256SUMS
      - name: Attest native assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            .woodpecker-out/bridge/*.tar.gz
            .woodpecker-out/bridge/SHA256SUMS
            .woodpecker-out/bridge/SHA256SUMS.sigstore.json
            .woodpecker-out/bridge/woodpecker-provenance.json
      - name: Attach new signature without replacing existing assets
        if: steps.native.outputs.signature_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" .woodpecker-out/bridge/SHA256SUMS.sigstore.json --repo "$GITHUB_REPOSITORY"
      - name: Publish verified native draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"

  woodpecker-packaging:
    name: Coordinate verified native packaging merge
    if: vars.WOODPECKER_PUBLISHING == 'true' && github.event_name == 'workflow_dispatch' && inputs.woodpecker_finalize && !inputs.woodpecker_bridge && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install existing release signature verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify immutable native intent and coordinate protected squash merge
        env:
          GITHUB_COORDINATOR_TOKEN: ${{ github.token }}
          WOODPECKER_PUBLISHING: ${{ vars.WOODPECKER_PUBLISHING }}
          WOODPECKER_PUBLISHER_ID: ${{ vars.WOODPECKER_PUBLISHER_ID }}
          PACKAGING_PR: ${{ inputs.packaging_pr }}
          PACKAGING_HEAD: ${{ inputs.packaging_head }}
          PACKAGING_BASE: ${{ inputs.packaging_base }}
          PACKAGING_TREE: ${{ inputs.packaging_tree }}
        run: python3 scripts/ci/woodpecker-publish.py finalize-packaging
      - name: Retain verified completion or failure receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-packaging-merge-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: .woodpecker-out/packaging-receipt.json
          if-no-files-found: error
