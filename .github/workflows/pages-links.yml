name: Pages links

on:
  pull_request:
    paths:
      - site/**
      - .github/workflows/pages-links.yml
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve latest published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "SITE_RELEASE_VERSION=$tag" >> "$GITHUB_ENV"
      - name: Build link-check target
        run: |
          version="$SITE_RELEASE_VERSION"
          python3 scripts/ci/build-pages-site.py --architecture docs/architecture/appicon.html --architecture-name appicon.html --version "$version"
      - name: Check internal and external links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --no-progress --accept 200,429 --exclude '^https://bolens[.]github[.]io/appicon/changelog/$' '_site/**/*.html'
          fail: true
