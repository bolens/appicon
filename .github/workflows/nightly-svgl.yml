name: Nightly SVGL smoke

# Live resolve against api.svgl.app — not required to merge.
# Runs on a schedule and on manual dispatch.

on:
  schedule:
    - cron: "17 6 * * *" # 06:17 UTC daily
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  svgl-smoke:
    if: (vars.WOODPECKER_LINUX_CI != 'true' || vars.WOODPECKER_PUBLISHING != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: "1.26.x"

      - name: Build
        run: make build

      - name: Live resolve (known titles)
        run: bash scripts/ci/nightly-svgl-smoke.sh
